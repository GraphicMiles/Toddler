name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4096m
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000

jobs:
  build-android:
    name: Build ForgeAI Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          clean: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK, NDK, and CMake
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Verify Java and Android toolchain
        shell: bash
        run: |
          set -e

          java -version
          adb version
          cmake --version

          test -f package.json
          test -f package-lock.json
          test -f third_party/llama.cpp/include/llama.h
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/cpp/CMakeLists.txt
          test -f android/app/src/main/cpp/OnDeviceRuntime.cpp
          test -f android/app/src/main/java/ai/forgeai/app/OnDeviceRuntime.java
          test -f android/app/src/main/java/ai/forgeai/app/MainActivity.java

          grep -q "gradle-8.7" android/gradle/wrapper/gradle-wrapper.properties
          grep -q "com.android.tools.build:gradle:8.6.1" android/build.gradle
          grep -q "26.1.10909125" android/app/build.gradle
          grep -q "GGML_BACKEND_DL ON" android/app/src/main/cpp/CMakeLists.txt
          grep -q "GGML_CPU_ALL_VARIANTS OFF" android/app/src/main/cpp/CMakeLists.txt

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          npm ci

      - name: Run unit and safety tests
        shell: bash
        run: |
          npm test

      - name: Build web application
        shell: bash
        run: |
          npm run build

      - name: Sync Capacitor Android project
        shell: bash
        run: |
          npx cap sync android

      - name: Verify generated Capacitor project
        shell: bash
        run: |
          set -e

          test -f android/app/capacitor.build.gradle
          grep -q "forgeai-device-capacity" android/app/capacitor.build.gradle
          grep -q "forgeai-device-capacity" android/capacitor.settings.gradle

      - name: Build Android APK
        shell: bash
        working-directory: android
        run: |
          set -e
          chmod +x gradlew

          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"

            if ./gradlew assembleDebug \
              --no-daemon \
              --no-parallel \
              --max-workers=2 \
              --stacktrace; then
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Android build failed after 3 attempts."
              exit 1
            fi

            echo "Build failed. Retrying in 30 seconds..."
            sleep 30
          done

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK_PATH"
          test -s "$APK_PATH"

          echo "APK successfully created:"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
