name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4096m
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2

jobs:
  build-android:
    name: Build ForgeAI Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Install JavaScript dependencies
        run: npm ci

      # Downloads the exact llama.cpp revision required by the CMake project
      # and verifies Java/SDK/NDK/CMake before the expensive build begins.
      - name: Verify Android build environment
        run: npm run android:preflight

      - name: Run unit tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build direct llama.cpp Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --no-parallel --max-workers=2 --stacktrace

      - name: Verify APK artifact
        shell: bash
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
