name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4096m
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000

jobs:
  build-android:
    name: Build ForgeAI Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          clean: true

      - name: Ensure llama.cpp is present
        shell: bash
        run: |
          # The .gitmodules file references third_party/llama.cpp but the
          # submodule pointer was never committed to the tree, so actions/checkout
          # with submodules:recursive leaves the directory empty.  Clone it directly.
          if [ ! -f "third_party/llama.cpp/include/llama.h" ]; then
            echo "llama.cpp submodule missing — cloning directly..."
            mkdir -p third_party
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          fi
          test -f third_party/llama.cpp/include/llama.h && echo "llama.h confirmed."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK, NDK, and CMake
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

          # Prepend the Android SDK's CMake 3.22.1 to PATH so it takes
          # precedence over the runner's pre-installed CMake 3.31.x.
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Verify Java and Android toolchain
        shell: bash
        run: |
          java -version
          adb version
          cmake --version

          # Extract MAJOR.MINOR.PATCH, stripping any suffix like -g37088a8
          cmake_version=$(cmake --version | head -n1 | awk '{print $NF}' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "Detected CMake version: $cmake_version"
          echo "$cmake_version" | grep -qE '^3\.22\.' || { echo "CMake version check failed: expected 3.22.x, found $cmake_version"; exit 1; }

          # Verify required files exist
          failures=0
          for f in \
            package.json \
            package-lock.json \
            third_party/llama.cpp/include/llama.h \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/app/src/main/cpp/CMakeLists.txt \
            android/app/src/main/cpp/OnDeviceRuntime.cpp \
            android/app/src/main/java/ai/forgeai/app/OnDeviceRuntime.java \
            android/app/src/main/java/ai/forgeai/app/MainActivity.java; do
            if [ ! -f "$f" ]; then
              echo "MISSING FILE: $f"
              failures=$((failures + 1))
            else
              echo "OK: $f"
            fi
          done

          # Verify expected content in key files
          checks=(
            "gradle-8.7|android/gradle/wrapper/gradle-wrapper.properties"
            "com.android.tools.build:gradle:8.6.1|android/build.gradle"
            "26.1.10909125|android/app/build.gradle"
            "GGML_BACKEND_DL ON|android/app/src/main/cpp/CMakeLists.txt"
            "GGML_CPU_ALL_VARIANTS OFF|android/app/src/main/cpp/CMakeLists.txt"
          )
          for entry in "${checks[@]}"; do
            pattern="${entry%%|*}"
            file="${entry#*|}"
            if [ ! -f "$file" ]; then
              echo "SKIP grep: $file does not exist"
            elif grep -q "$pattern" "$file"; then
              echo "OK: grep '$pattern' in $file"
            else
              echo "MISSING PATTERN: '$pattern' not found in $file"
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" -gt 0 ]; then
            echo "Verification found $failures issue(s). See above for details."
            exit 1
          fi

          echo "All toolchain checks passed."

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          npm ci

      - name: Run unit and safety tests
        shell: bash
        run: |
          npm test

      - name: Build web application
        shell: bash
        run: |
          npm run build

      - name: Sync Capacitor Android project
        shell: bash
        run: |
          npx cap sync android

      - name: Verify generated Capacitor project
        shell: bash
        run: |
          # cap sync regenerates capacitor.build.gradle and capacitor.settings.gradle.
          # Both must reference the custom forgeai-device-capacity plugin.
          failures=0

          for f in \
            android/app/capacitor.build.gradle \
            android/capacitor.settings.gradle; do
            if [ ! -f "$f" ]; then
              echo "MISSING FILE: $f"
              failures=$((failures + 1))
            elif grep -q "forgeai-device-capacity" "$f"; then
              echo "OK: forgeai-device-capacity found in $f"
            else
              echo "MISSING: forgeai-device-capacity not in $f"
              failures=$((failures + 1))
            fi
          done

          if [ "$failures" -gt 0 ]; then
            echo "Capacitor project verification failed ($failures issue(s))."
            exit 1
          fi

          echo "Capacitor project checks passed."

      - name: Build Android APK
        shell: bash
        working-directory: android
        run: |
          set -e
          chmod +x gradlew

          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"

            if ./gradlew assembleDebug \
              --no-daemon \
              --no-parallel \
              --max-workers=2 \
              --stacktrace; then
              break
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Android build failed after 3 attempts."
              exit 1
            fi

            echo "Build failed. Retrying in 30 seconds..."
            sleep 30
          done

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK_PATH"
          test -s "$APK_PATH"

          echo "APK successfully created:"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
